<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Listings - UsedCarValue AI</title>
</head>
  <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0c0c0c 0%, #1a1a2e 50%, #16213e 100%);
            color: white;
            overflow-x: hidden;
            min-height: 100vh;
        }

        .background-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 50%, rgba(59, 130, 246, 0.1) 0%, transparent 70%);
            z-index: 1;
            pointer-events: none;
        }

        .nav-header {
            position: sticky;
            top: 0;
            padding: 1.5rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .nav-logo {
            font-size: 1.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6, #06b6d4);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-links {
            display: flex;
            gap: 2rem;
            list-style: none;
            align-items: center;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s ease;
            padding: 0.5rem 1rem;
            border-radius: 25px;
        }

        .nav-links a:hover {
            color: #3b82f6;
            background: rgba(59, 130, 246, 0.1);
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
            position: relative;
            z-index: 10;
        }

        .page-header {
            text-align: center;
            margin-bottom: 3rem;
        }

        .page-title {
            font-size: 3rem;
            font-weight: 900;
            margin-bottom: 1rem;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6, #06b6d4);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .page-subtitle {
            font-size: 1.2rem;
            color: #94a3b8;
            margin-bottom: 2rem;
        }

        .filter-section {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 1.5rem;
            margin-bottom: 3rem;
        }

        .filter-controls {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            align-items: center;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .filter-label {
            font-size: 0.9rem;
            color: #94a3b8;
            font-weight: 500;
        }

        .filter-select, .filter-input {
            padding: 0.5rem 1rem;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.05);
            color: white;
            font-size: 0.9rem;
        }

        .filter-select option {
            background: #1a1a2e;
            color: white;
        }

        .filter-select:focus, .filter-input:focus {
            outline: none;
            border-color: #3b82f6;
        }

        .cars-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(400px, 1fr));
            gap: 2rem;
            margin-bottom: 3rem;
        }

        .car-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            overflow: hidden;
            transition: all 0.3s ease;
            cursor: pointer;
            animation: fadeInUp 0.5s ease forwards;
            opacity: 0;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .car-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 40px rgba(59, 130, 246, 0.2);
            border-color: rgba(59, 130, 246, 0.3);
        }

        .car-image {
            width: 100%;
            height: 250px;
            background-size: cover;
            background-position: center;
            position: relative;
            background-color: rgba(59, 130, 246, 0.1);
        }

        .car-image-placeholder {
            width: 100%;
            height: 250px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.2), rgba(139, 92, 246, 0.2));
            font-size: 4rem;
        }

        .car-overlay {
            position: absolute;
            top: 1rem;
            left: 1rem;
            right: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .status-badge {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            padding: 0.4rem 0.8rem;
            border-radius: 15px;
            font-size: 0.8rem;
            font-weight: 600;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
        }

        .status-badge.sold {
            background: linear-gradient(135deg, #ef4444, #dc2626);
        }

        .status-badge.pending {
            background: linear-gradient(135deg, #f59e0b, #d97706);
        }

        .car-actions {
            display: flex;
            gap: 0.5rem;
        }

        .action-btn {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            border: none;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
        }

        .action-btn:hover {
            background: rgba(59, 130, 246, 0.3);
            transform: scale(1.1);
        }

        .action-btn.favorited {
            background: rgba(239, 68, 68, 0.5);
        }

        .car-content {
            padding: 1.5rem;
        }

        .car-title {
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            color: #3b82f6;
        }

        .car-details {
            color: #94a3b8;
            font-size: 0.9rem;
            margin-bottom: 1rem;
        }

        .car-specs {
            display: flex;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .spec-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            flex: 1;
        }

        .spec-value {
            font-size: 1.1rem;
            font-weight: 600;
            color: #3b82f6;
        }

        .spec-label {
            font-size: 0.8rem;
            color: #94a3b8;
            margin-top: 0.2rem;
        }

        .car-price {
            font-size: 1.8rem;
            font-weight: 800;
            color: #3b82f6;
            margin-bottom: 1rem;
        }

        .car-actions-row {
            display: flex;
            gap: 1rem;
        }

        .btn-primary {
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            color: white;
            padding: 0.6rem 1.2rem;
            border: none;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.3);
            flex: 1;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(59, 130, 246, 0.4);
        }

        .btn-secondary {
            background: transparent;
            color: white;
            padding: 0.6rem 1.2rem;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            flex: 1;
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.5);
        }

        .load-more {
            text-align: center;
            margin-top: 2rem;
        }

        .load-more-btn {
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            color: white;
            padding: 1rem 2rem;
            border: none;
            border-radius: 25px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 25px rgba(59, 130, 246, 0.3);
        }

        .load-more-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 35px rgba(59, 130, 246, 0.4);
        }

        .load-more-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        /* Loading spinner */
        .loading-container {
            text-align: center;
            padding: 4rem 2rem;
        }
        .loading-spinner {
            border: 4px solid rgba(59, 130, 246, 0.2);
            border-top: 4px solid #3b82f6;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        .no-cars-message {
            text-align: center;
            padding: 4rem 2rem;
            color: #94a3b8;
            font-size: 1.2rem;
        }

        .no-cars-message .icon {
            font-size: 4rem;
            margin-bottom: 1rem;
            display: block;
        }

        /* Modal */
        .car-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            z-index: 2000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .modal-content {
            background: rgba(26, 26, 46, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            max-width: 800px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
        }

        .modal-header {
            padding: 2rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: #3b82f6;
        }

        .modal-close {
            background: none;
            border: none;
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .modal-close:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .modal-body {
            padding: 2rem;
        }

        .modal-image {
            width: 100%;
            height: 300px;
            background-size: cover;
            background-position: center;
            border-radius: 15px;
            margin-bottom: 1.5rem;
            background-color: rgba(59, 130, 246, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 5rem;
        }

        .modal-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .modal-spec {
            display: flex;
            justify-content: space-between;
            padding: 0.5rem 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .modal-spec-label {
            color: #94a3b8;
        }

        .modal-spec-value {
            color: white;
            font-weight: 600;
        }

        .modal-features {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
        }

        .feature-tag {
            background: rgba(59, 130, 246, 0.2);
            color: #3b82f6;
            padding: 0.3rem 0.6rem;
            border-radius: 12px;
            font-size: 0.8rem;
        }

        .modal-actions {
            display: flex;
            gap: 1rem;
            margin-top: 1.5rem;
        }

        .modal-actions button {
            flex: 1;
        }

        /* Contact toast */
        .toast {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            background: rgba(16, 185, 129, 0.9);
            backdrop-filter: blur(10px);
            color: white;
            padding: 1rem 2rem;
            border-radius: 15px;
            z-index: 3000;
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.4s ease;
            box-shadow: 0 10px 30px rgba(16, 185, 129, 0.3);
        }

        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        @media (max-width: 768px) {
            .cars-grid {
                grid-template-columns: 1fr;
            }
            
            .filter-controls {
                flex-direction: column;
            }
            
            .filter-group {
                width: 100%;
            }
            
            .car-actions-row {
                flex-direction: column;
            }
            
            .modal-details {
                grid-template-columns: 1fr;
            }
            
            .nav-links {
                display: none;
            }

            .page-title {
                font-size: 2rem;
            }

            .modal-actions {
                flex-direction: column;
            }
        }
    </style>
<body>
    <div class="background-overlay"></div>
    
    <nav class="nav-header">
        <a href="/hr" style="text-decoration:none;"><div class="nav-logo">UsedCarValue AI</div></a>
        <ul class="nav-links">
            <li><a href="/hr">Home</a></li>
            <li><a href="/pre">Predict Price</a></li>
            <li><a href="/cars">Cars</a></li>
            <li><a href="/contact">Contact</a></li>
        </ul>
    </nav>

    <div class="container">
        <div class="page-header">
            <h1 class="page-title">Premium Car Collection</h1>
            <p class="page-subtitle">Discover your perfect car from our extensive collection of premium vehicles</p>
            <p id="carCount" style="color: #3b82f6; font-weight: 600;"></p>
        </div>

        <div class="filter-section">
            <div class="filter-controls">
                <div class="filter-group">
                    <label class="filter-label">Brand</label>
                    <select class="filter-select" id="brandFilter">
                        <option value="">All Brands</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label class="filter-label">Price Range</label>
                    <select class="filter-select" id="priceFilter">
                        <option value="">All Prices</option>
                        <option value="0-100000">Under ₹1 Lakh</option>
                        <option value="100000-500000">₹1-5 Lakh</option>
                        <option value="500000-1000000">₹5-10 Lakh</option>
                        <option value="1000000-2000000">₹10-20 Lakh</option>
                        <option value="2000000-5000000">₹20-50 Lakh</option>
                        <option value="5000000-10000000">Above ₹50 Lakh</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label class="filter-label">Fuel Type</label>
                    <select class="filter-select" id="fuelFilter">
                        <option value="">All Fuel Types</option>
                        <option value="Petrol">Petrol</option>
                        <option value="Diesel">Diesel</option>
                        <option value="Electric">Electric</option>
                        <option value="CNG">CNG</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label class="filter-label">Transmission</label>
                    <select class="filter-select" id="transmissionFilter">
                        <option value="">All Types</option>
                        <option value="Manual">Manual</option>
                        <option value="Automatic">Automatic</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label class="filter-label">Search</label>
                    <input type="text" class="filter-input" id="searchInput" placeholder="Search by brand or model...">
                </div>
            </div>
        </div>

        <div class="cars-grid" id="carsGrid">
            <div class="loading-container" id="loadingState">
                <div class="loading-spinner"></div>
                <p style="color: #94a3b8;">Loading cars...</p>
            </div>
        </div>

        <div class="load-more" id="loadMoreSection" style="display:none;">
            <button class="load-more-btn" id="loadMoreBtn">Load More Cars</button>
        </div>
    </div>

    <!-- Modal for car details -->
    <div class="car-modal" id="carModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title" id="modalTitle"></h2>
                <button class="modal-close" id="modalClose">×</button>
            </div>
            <div class="modal-body" id="modalBody">
            </div>
        </div>
    </div>

    <!-- Toast notification -->
    <div class="toast" id="toast"></div>

    <script>
        let allCars = [];
        let filteredCars = [];
        let displayedCount = 0;
        const carsPerPage = 6;
        let favorites = JSON.parse(localStorage.getItem('carFavorites') || '[]');

        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            loadCars();
            setupEventListeners();
        });

        async function loadCars() {
            try {
                const response = await fetch('/api/car');
                const data = await response.json();
                
                if (data.success && data.cars) {
                    allCars = data.cars;
                } else {
                    allCars = [];
                }
            } catch (error) {
                console.error('Error loading cars:', error);
                allCars = [];
            }

            // Populate brand filter dynamically
            const brands = [...new Set(allCars.map(c => c.brand).filter(Boolean))].sort();
            const brandFilter = document.getElementById('brandFilter');
            brands.forEach(brand => {
                const opt = document.createElement('option');
                opt.value = brand;
                opt.textContent = brand;
                brandFilter.appendChild(opt);
            });

            applyFilters();
        }

        function applyFilters() {
            const brand = document.getElementById('brandFilter').value;
            const price = document.getElementById('priceFilter').value;
            const fuel = document.getElementById('fuelFilter').value;
            const transmission = document.getElementById('transmissionFilter').value;
            const search = document.getElementById('searchInput').value.toLowerCase();

            filteredCars = allCars.filter(car => {
                if (brand && car.brand !== brand) return false;
                if (fuel && car.fuel !== fuel) return false;
                if (transmission && car.transmission !== transmission) return false;

                if (price) {
                    const [min, max] = price.split('-').map(Number);
                    const carPrice = car.price || 0;
                    if (carPrice < min || carPrice > max) return false;
                }

                if (search) {
                    const searchStr = `${car.brand || ''} ${car.model || ''} ${car.location || ''}`.toLowerCase();
                    if (!searchStr.includes(search)) return false;
                }

                return true;
            });

            displayedCount = 0;
            document.getElementById('carsGrid').innerHTML = '';
            document.getElementById('carCount').textContent = `${filteredCars.length} car${filteredCars.length !== 1 ? 's' : ''} found`;
            
            if (filteredCars.length === 0) {
                document.getElementById('carsGrid').innerHTML = `
                    <div class="no-cars-message" style="grid-column: 1/-1;">
                        <span class="icon">🚗</span>
                        <p>No cars found matching your filters.</p>
                        <p style="margin-top:0.5rem; font-size: 0.9rem;">Try adjusting your search criteria.</p>
                    </div>`;
                document.getElementById('loadMoreSection').style.display = 'none';
            } else {
                displayNextBatch();
            }
        }

        function displayNextBatch() {
            const grid = document.getElementById('carsGrid');
            const batch = filteredCars.slice(displayedCount, displayedCount + carsPerPage);
            
            batch.forEach((car, index) => {
                const card = createCarCard(car, displayedCount + index);
                grid.appendChild(card);
            });

            displayedCount += batch.length;

            // Show/hide load more button
            if (displayedCount < filteredCars.length) {
                document.getElementById('loadMoreSection').style.display = 'block';
                document.getElementById('loadMoreBtn').textContent = `Load More (${filteredCars.length - displayedCount} remaining)`;
            } else {
                document.getElementById('loadMoreSection').style.display = 'none';
            }
        }

        function createCarCard(car, index) {
            const card = document.createElement('div');
            card.className = 'car-card';
            card.style.animationDelay = `${(index % carsPerPage) * 0.1}s`;

            const status = car.status || car.availability || 'available';
            const statusClass = status === 'sold' ? 'sold' : status === 'pending' ? 'pending' : '';
            const statusText = status.charAt(0).toUpperCase() + status.slice(1);
            const carId = car._id || car.id;
            const isFav = favorites.includes(carId);
            
            // Determine image
            let imageHtml;
            const imgSrc = car.image || (car.images && car.images[0]) || '';
            if (imgSrc && !imgSrc.includes('placeholder')) {
                imageHtml = `<div class="car-image" style="background-image: url('${imgSrc}')">`;
            } else {
                imageHtml = `<div class="car-image-placeholder">🚗</div><div class="car-image" style="display:none;">`;
            }

            const price = car.price || 0;
            const kmDriven = car.km_driven || car.kmDriven || 0;
            const owner = car.owner || 'N/A';
            const brand = car.brand || 'Unknown';
            const model = car.model || '';
            const year = car.year || '';
            const fuel = car.fuel || 'N/A';
            const transmission = car.transmission || 'N/A';
            const location = car.location || 'N/A';

            let priceDisplay;
            if (price >= 10000000) {
                priceDisplay = `₹${(price / 10000000).toFixed(1)} Cr`;
            } else if (price >= 100000) {
                priceDisplay = `₹${(price / 100000).toFixed(1)} Lakh`;
            } else {
                priceDisplay = `₹${price.toLocaleString('en-IN')}`;
            }

            card.innerHTML = `
                <div style="position:relative;">
                    ${imgSrc && !imgSrc.includes('placeholder') 
                        ? `<div class="car-image" style="background-image: url('${imgSrc}')">` 
                        : `<div class="car-image-placeholder">🚗`}
                    </div>
                    <div class="car-overlay">
                        <div class="status-badge ${statusClass}">${statusText}</div>
                        <div class="car-actions">
                            <button class="action-btn ${isFav ? 'favorited' : ''}" onclick="event.stopPropagation(); toggleFavorite('${carId}', this)" title="Add to favorites">♥</button>
                            <button class="action-btn" onclick="event.stopPropagation(); shareCar('${carId}')" title="Share">📤</button>
                        </div>
                    </div>
                </div>
                <div class="car-content">
                    <h3 class="car-title">${brand} ${model}</h3>
                    <p class="car-details">${year} • ${kmDriven.toLocaleString('en-IN')} km • ${owner} Owner</p>
                    <div class="car-specs">
                        <div class="spec-item">
                            <div class="spec-value">${fuel}</div>
                            <div class="spec-label">Fuel</div>
                        </div>
                        <div class="spec-item">
                            <div class="spec-value">${transmission}</div>
                            <div class="spec-label">Transmission</div>
                        </div>
                        <div class="spec-item">
                            <div class="spec-value">${location}</div>
                            <div class="spec-label">Location</div>
                        </div>
                    </div>
                    <div class="car-price">${priceDisplay}</div>
                    <div class="car-actions-row">
                        <button class="btn-primary" onclick="event.stopPropagation(); openCarModal('${carId}')" ${status !== 'available' ? 'disabled' : ''}>
                            ${status === 'available' ? 'View Details' : statusText}
                        </button>
                        <button class="btn-secondary" onclick="event.stopPropagation(); contactDealer('${carId}')" ${status !== 'available' ? 'disabled' : ''}>
                            Contact
                        </button>
                    </div>
                </div>
            `;

            card.addEventListener('click', () => openCarModal(carId));
            return card;
        }

        function setupEventListeners() {
            document.getElementById('loadMoreBtn').addEventListener('click', displayNextBatch);
            document.getElementById('brandFilter').addEventListener('change', applyFilters);
            document.getElementById('priceFilter').addEventListener('change', applyFilters);
            document.getElementById('fuelFilter').addEventListener('change', applyFilters);
            document.getElementById('transmissionFilter').addEventListener('change', applyFilters);
            
            let searchTimeout;
            document.getElementById('searchInput').addEventListener('input', function() {
                clearTimeout(searchTimeout);
                searchTimeout = setTimeout(applyFilters, 300);
            });

            document.getElementById('modalClose').addEventListener('click', closeCarModal);
            document.getElementById('carModal').addEventListener('click', function(e) {
                if (e.target === this) closeCarModal();
            });
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape') closeCarModal();
            });
        }

        function openCarModal(carId) {
            const car = allCars.find(c => (c._id || c.id) === carId);
            if (!car) return;

            const brand = car.brand || 'Unknown';
            const model = car.model || '';
            document.getElementById('modalTitle').textContent = `${brand} ${model}`;

            const price = car.price || 0;
            const kmDriven = car.km_driven || car.kmDriven || 0;
            const imgSrc = car.image || (car.images && car.images[0]) || '';
            const features = car.features || [];

            let priceDisplay;
            if (price >= 10000000) priceDisplay = `₹${(price / 10000000).toFixed(1)} Cr`;
            else if (price >= 100000) priceDisplay = `₹${(price / 100000).toFixed(1)} Lakh`;
            else priceDisplay = `₹${price.toLocaleString('en-IN')}`;

            const modalBody = document.getElementById('modalBody');
            modalBody.innerHTML = `
                <div class="modal-image" ${imgSrc && !imgSrc.includes('placeholder') ? `style="background-image: url('${imgSrc}')"` : ''}>
                    ${!imgSrc || imgSrc.includes('placeholder') ? '🚗' : ''}
                </div>
                <div style="font-size: 2rem; font-weight: 800; color: #3b82f6; margin-bottom: 1rem;">${priceDisplay}</div>
                <div class="modal-details">
                    <div class="modal-spec">
                        <span class="modal-spec-label">Year:</span>
                        <span class="modal-spec-value">${car.year || 'N/A'}</span>
                    </div>
                    <div class="modal-spec">
                        <span class="modal-spec-label">Fuel Type:</span>
                        <span class="modal-spec-value">${car.fuel || 'N/A'}</span>
                    </div>
                    <div class="modal-spec">
                        <span class="modal-spec-label">Transmission:</span>
                        <span class="modal-spec-value">${car.transmission || 'N/A'}</span>
                    </div>
                    <div class="modal-spec">
                        <span class="modal-spec-label">KM Driven:</span>
                        <span class="modal-spec-value">${kmDriven.toLocaleString('en-IN')} km</span>
                    </div>
                    <div class="modal-spec">
                        <span class="modal-spec-label">Owner:</span>
                        <span class="modal-spec-value">${car.owner || 'N/A'}</span>
                    </div>
                    <div class="modal-spec">
                        <span class="modal-spec-label">Location:</span>
                        <span class="modal-spec-value">${car.location || 'N/A'}</span>
                    </div>
                    ${car.engine ? `<div class="modal-spec"><span class="modal-spec-label">Engine:</span><span class="modal-spec-value">${car.engine}</span></div>` : ''}
                    ${car.power ? `<div class="modal-spec"><span class="modal-spec-label">Power:</span><span class="modal-spec-value">${car.power}</span></div>` : ''}
                    ${car.mileage ? `<div class="modal-spec"><span class="modal-spec-label">Mileage:</span><span class="modal-spec-value">${car.mileage}</span></div>` : ''}
                    ${car.color ? `<div class="modal-spec"><span class="modal-spec-label">Color:</span><span class="modal-spec-value">${car.color}</span></div>` : ''}
                    ${car.seats ? `<div class="modal-spec"><span class="modal-spec-label">Seats:</span><span class="modal-spec-value">${car.seats}</span></div>` : ''}
                    ${car.seller_type ? `<div class="modal-spec"><span class="modal-spec-label">Seller:</span><span class="modal-spec-value">${car.seller_type}</span></div>` : ''}
                </div>
                ${features.length > 0 ? `
                    <div style="margin-bottom: 1rem;">
                        <h4 style="color: #3b82f6; margin-bottom: 0.5rem;">Features:</h4>
                        <div class="modal-features">
                            ${features.map(f => `<span class="feature-tag">${f}</span>`).join('')}
                        </div>
                    </div>
                ` : ''}
                ${car.description ? `
                    <div style="margin-bottom: 1.5rem;">
                        <h4 style="color: #3b82f6; margin-bottom: 0.5rem;">Description:</h4>
                        <p style="color: #94a3b8; line-height: 1.6;">${car.description}</p>
                    </div>
                ` : ''}
                <div class="modal-actions">
                    <button class="btn-primary" onclick="contactDealer('${carId}')">Contact Dealer</button>
                    <button class="btn-secondary" onclick="scheduleTestDrive('${carId}')">Schedule Test Drive</button>
                </div>
            `;

            document.getElementById('carModal').style.display = 'flex';
            document.body.style.overflow = 'hidden';
        }

        function closeCarModal() {
            document.getElementById('carModal').style.display = 'none';
            document.body.style.overflow = 'auto';
        }

        function toggleFavorite(carId, btn) {
            const idx = favorites.indexOf(carId);
            if (idx === -1) {
                favorites.push(carId);
                if (btn) btn.classList.add('favorited');
                showToast('Added to favorites ♥');
            } else {
                favorites.splice(idx, 1);
                if (btn) btn.classList.remove('favorited');
                showToast('Removed from favorites');
            }
            localStorage.setItem('carFavorites', JSON.stringify(favorites));
        }

        function shareCar(carId) {
            const car = allCars.find(c => (c._id || c.id) === carId);
            if (!car) return;
            
            const shareText = `Check out this ${car.brand} ${car.model || ''} for ₹${((car.price || 0) / 100000).toFixed(1)} Lakh on UsedCarValue AI!`;
            
            if (navigator.share) {
                navigator.share({
                    title: `${car.brand} ${car.model || ''}`,
                    text: shareText,
                    url: window.location.origin + '/cars'
                }).catch(() => {});
            } else {
                navigator.clipboard.writeText(shareText).then(() => {
                    showToast('Car details copied to clipboard!');
                }).catch(() => {
                    showToast('Could not copy to clipboard');
                });
            }
        }

        function contactDealer(carId) {
            const car = allCars.find(c => (c._id || c.id) === carId);
            if (!car) return;
            const subject = `Inquiry about ${car.brand} ${car.model || ''}`;
            window.location.href = `/contact?subject=${encodeURIComponent(subject)}`;
        }

        function scheduleTestDrive(carId) {
            const car = allCars.find(c => (c._id || c.id) === carId);
            if (!car) return;
            const subject = `Test Drive for ${car.brand} ${car.model || ''}`;
            window.location.href = `/contact?subject=${encodeURIComponent(subject)}`;
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }
    </script>
</body>
</html>
